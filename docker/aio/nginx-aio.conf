# Main nginx config of the all-in-one image (docker/aio.Dockerfile). Runs unprivileged
# (PUID/PGID): pid and temp files live under /tmp/tickerglass-nginx, logs go to the
# container's stdout/stderr. The server block is rendered from docker/nginx.conf.template
# by docker/aio/entrypoint.sh.
worker_processes 1;
pid /tmp/tickerglass-nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    client_body_temp_path /tmp/tickerglass-nginx/body;
    proxy_temp_path /tmp/tickerglass-nginx/proxy;
    fastcgi_temp_path /tmp/tickerglass-nginx/fastcgi;
    uwsgi_temp_path /tmp/tickerglass-nginx/uwsgi;
    scgi_temp_path /tmp/tickerglass-nginx/scgi;

    include /tmp/tickerglass-nginx/conf.d/*.conf;
}
