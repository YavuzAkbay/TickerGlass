server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # User-script sandbox worker (docs/plans/user-scripts.md §2): this response CSP is
    # the network boundary for user code. No 'self' in script-src: the worker is one
    # self-contained file (build guard in apps/web/vite.config.ts), so even same-origin
    # import() is blocked. Keep in sync with SANDBOX_CSP in apps/web/vite.config.ts.
    location ~ ^/assets/sandbox-worker-[^/]+\.js$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'; worker-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
