<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 56 424 400">
  <!-- TickerGlass: a price line crossing a pane of glass, shifted as if refracted. -->
  <style>
    .pane { fill: #4c5bd4; }
    .line { fill: none; stroke: #4c5bd4; }
    @media (prefers-color-scheme: dark) {
      .pane { fill: #9aa8ff; }
      .line { stroke: #9aa8ff; }
    }
  </style>
  <defs>
    <mask id="cut">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <polyline points="200,184 288,272 400,160" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <clipPath id="l"><rect width="228" height="512"/></clipPath>
  </defs>
  <rect x="256" y="72" width="192" height="368" rx="56" class="pane" mask="url(#cut)"/>
  <polyline clip-path="url(#l)" points="72,336 168,240 280,352" class="line" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
