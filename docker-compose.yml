services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/investopen.db}
    volumes:
      - api-data:/data
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      start_period: 20s
      start_interval: 1s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

  alerts:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: alerts
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000

  # Optional: `docker compose --profile postgres up` and set DATABASE_URL in .env.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: investopen
      POSTGRES_DB: investopen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  api-data:
  pg-data:
