services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/tickerglass.db}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-yahoo}
      PROVIDER_SWITCHING: ${PROVIDER_SWITCHING:-true}
      PROVIDER_SWITCH_COOLDOWN_S: ${PROVIDER_SWITCH_COOLDOWN_S:-10}
      # Twelve Data (MARKET_PROVIDER=twelvedata); empty = unset (the plan's value applies).
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      TWELVEDATA_PLAN: ${TWELVEDATA_PLAN:-basic}
      TWELVEDATA_CREDITS_PER_MIN: ${TWELVEDATA_CREDITS_PER_MIN:-}
      TWELVEDATA_DAILY_CREDITS: ${TWELVEDATA_DAILY_CREDITS:-}
      TWELVEDATA_EXTENDED_HOURS: ${TWELVEDATA_EXTENDED_HOURS:-}
      TWELVEDATA_EVENTS: ${TWELVEDATA_EVENTS:-}
      TWELVEDATA_FUNDAMENTALS: ${TWELVEDATA_FUNDAMENTALS:-}
      TWELVEDATA_INTERNATIONAL: ${TWELVEDATA_INTERNATIONAL:-}
      TWELVEDATA_POLL_INTERVAL_S: ${TWELVEDATA_POLL_INTERVAL_S:-}
      # Alert notifications (docs/alerts.md section 4.1); all optional, empty = unset.
      ALERTS_WEBHOOK_URL: ${ALERTS_WEBHOOK_URL:-}
      ALERTS_WEBHOOK_SECRET: ${ALERTS_WEBHOOK_SECRET:-}
      ALERTS_WEBHOOK_ALLOW_PRIVATE: ${ALERTS_WEBHOOK_ALLOW_PRIVATE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      ALERTS_LOG_MAX: ${ALERTS_LOG_MAX:-5000}
      ALERTS_INTERNAL_TOKEN: ${ALERTS_INTERNAL_TOKEN:-}
    volumes:
      - api-data:/data
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      start_period: 20s
      start_interval: 1s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

  alerts:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: alerts
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      ALERTS_INTERNAL_TOKEN: ${ALERTS_INTERNAL_TOKEN:-}
      ALERTS_POLL_MS: ${ALERTS_POLL_MS:-30000}
      ALERTS_CLOSE_GRACE_S: ${ALERTS_CLOSE_GRACE_S:-60}
      ALERTS_MIN_REFIRE_S: ${ALERTS_MIN_REFIRE_S:-60}
      ALERTS_STATE_FLUSH_MS: ${ALERTS_STATE_FLUSH_MS:-5000}
      ALERTS_MAX_BARS: ${ALERTS_MAX_BARS:-5000}
      ALERTS_MAX_DRAWING_BARS: ${ALERTS_MAX_DRAWING_BARS:-20000}
      ALERTS_LOG_LEVEL: ${ALERTS_LOG_LEVEL:-info}

  # Optional: `docker compose --profile postgres up` and set DATABASE_URL in .env.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickerglass
      POSTGRES_DB: tickerglass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  api-data:
  pg-data:
