# Example Prometheus configuration that scrapes TickerGlass (docs/metrics.md). Merge the
# scrape_configs entry and the rule_files line into your own prometheus.yml.
#
# 1. Enable metrics on the TickerGlass server: METRICS_ENABLED=true and METRICS_TOKEN=<16+ chars>.
# 2. Put the same token, and nothing else, in a file Prometheus can read
#    (here /etc/prometheus/tickerglass.token). Prometheus sends it as `Authorization: Bearer ...`.
# 3. Point `targets` at the TickerGlass web port (8080 for the all-in-one image and the Compose
#    web service: nginx forwards /metrics to the API), or at the API (8000 / the API Service in
#    Kubernetes). Both serve the same /metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - tickerglass.rules.yml

scrape_configs:
  - job_name: tickerglass
    metrics_path: /metrics
    scheme: http # https when you scrape through a TLS reverse proxy
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tickerglass.token
    static_configs:
      - targets: ['tickerglass.lan:8080'] # host:port of the web port, or of the API
    # The API runs one worker; scraping more often than every 15 s gains nothing (database-backed
    # values are cached for 15 s).
    scrape_timeout: 10s
