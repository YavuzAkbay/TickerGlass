{{- if and .Values.metrics.enabled (not .Values.metrics.existingSecret) }}
{{- $name := include "tickerglass.metricsSecretName" . }}
{{- if and .Values.metrics.token (lt (len (toString .Values.metrics.token)) 16) }}
{{- fail "metrics.token must be at least 16 characters (or leave it empty to generate one)" }}
{{- end }}
{{- /* Generated once: later upgrades reuse the stored value (lookup is empty under `helm template`). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data | default dict }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tickerglass.labels" . | nindent 4 }}
  {{- if .Values.keepResources }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if .Values.metrics.token }}
  METRICS_TOKEN: {{ .Values.metrics.token | toString | b64enc | quote }}
  {{- else }}
  METRICS_TOKEN: {{ get $data "METRICS_TOKEN" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
{{- end }}
