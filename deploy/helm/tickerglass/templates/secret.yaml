{{- if not .Values.existingSecret }}
{{- $name := include "tickerglass.secretName" . }}
{{- /* Generated once: later upgrades reuse the stored values (lookup is empty under `helm template`). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data | default dict }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tickerglass.labels" . | nindent 4 }}
  {{- if .Values.keepResources }}
  annotations:
    # `helm uninstall` keeps it: a reinstall reuses the token and the session secret.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  ALERTS_INTERNAL_TOKEN: {{ get $data "ALERTS_INTERNAL_TOKEN" | default (randAlphaNum 48 | b64enc) | quote }}
  AUTH_SECRET: {{ get $data "AUTH_SECRET" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
