{{- if and .Values.api.persistence.enabled (not .Values.api.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tickerglass.fullname" . }}-data
  labels:
    {{- include "tickerglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- $annotations := .Values.api.persistence.annotations | default dict }}
  {{- if .Values.keepResources }}
  {{- $annotations = merge (dict "helm.sh/resource-policy" "keep") $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.api.persistence.accessModes | nindent 4 }}
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ if eq "-" .Values.api.persistence.storageClass }}""{{ else }}{{ .Values.api.persistence.storageClass | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size | quote }}
{{- end }}
