{{- $env := merge (dict) (.Values.web.extraEnv | default dict) (.Values.web.env | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tickerglass.fullname" . }}-web
  labels:
    {{- include "tickerglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tickerglass.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tickerglass.selectorLabels" (dict "ctx" . "component" "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No <SERVICE>_PORT-style env vars injected into the pod (a service named like an env var the
      # app reads would otherwise override it).
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "tickerglass.image" (dict "ctx" . "repository" .Values.web.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- if not (hasKey $env "TG_API_UPSTREAM") }}
            - name: TG_API_UPSTREAM
              value: {{ printf "%s-api:%v" (include "tickerglass.fullname" .) .Values.api.service.port | quote }}
            {{- end }}
            {{- include "tickerglass.envList" (dict "env" $env) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickerglass.fullname" . }}-web
  labels:
    {{- include "tickerglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "tickerglass.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
