# Umbrel app: the three TickerGlass images behind Umbrel's app proxy (which keeps Umbrel's login in
# front of the app). Container names are <app id>_<service>_1. Checked by deploy/check.py.
version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: tickerglass-store-tickerglass_web_1
      APP_PORT: 80

  api:
    image: ghcr.io/yavuzakbay/tickerglass-api:0.3.0
    restart: on-failure
    environment:
      DATABASE_URL: sqlite:////data/tickerglass.db
      MARKET_PROVIDER: yahoo
      AUTH_SECRET: ${APP_TICKERGLASS_AUTH_SECRET}
      ALERTS_INTERNAL_TOKEN: ${APP_TICKERGLASS_ALERTS_TOKEN}
      # Prometheus /metrics (docs/metrics.md), off by default.
      METRICS_ENABLED: 'false'
      METRICS_TOKEN: ''
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"
      interval: 30s
      start_period: 20s
      start_interval: 1s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/yavuzakbay/tickerglass-web:0.3.0
    restart: on-failure
    depends_on:
      - api
    environment:
      TG_API_UPSTREAM: tickerglass-store-tickerglass_api_1:8000

  alerts:
    image: ghcr.io/yavuzakbay/tickerglass-alerts:0.3.0
    restart: on-failure
    mem_limit: 1280m
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://tickerglass-store-tickerglass_api_1:8000
      ALERTS_INTERNAL_TOKEN: ${APP_TICKERGLASS_ALERTS_TOKEN}
